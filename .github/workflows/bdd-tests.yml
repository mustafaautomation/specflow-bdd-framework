name: BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: BDD Tests (.NET 10, headless Chrome)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Restore and build
        run: dotnet restore && dotnet build --no-restore

      - name: Run BDD tests
        run: dotnet test --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults
        env:
          HEADLESS: 'true'

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bdd-test-results
          path: |
            TestResults/
            bin/Debug/net10.0/reports/
          retention-days: 30
